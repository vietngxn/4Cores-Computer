<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../assets/styles/boostrap/bootstrap.min.css">
    <script src="../../assets/styles/boostrap/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../assets/styles/thanhtoannapas.css">
</head>

<body>
    <div class="fullform">
        <div class="page_transit">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="6" cy="6" r="6" fill="#B02B19" />
            </svg>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="6" cy="6" r="6" fill="#7E8287" />
            </svg>

            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="6" cy="6" r="6" fill="#7E8287" />
            </svg>
        </div>

        <div class="form_thongtin">
            <div id="form_thongtin_content">

                <div id="back_btn">
                    <svg id="back_icon" width="13" height="13" viewBox="0 0 13 13" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.41667 10.2916L1.625 6.49992M1.625 6.49992L5.41667 2.70825M1.625 6.49992H11.375"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p style="color: white;">Trở lại trang trước</p>
                </div>

                <div id="form_title">
                    <h2 id="thongtincanhan_title">Thanh toán </h2>
                    <span id="chonphuongthucthanhtoan_span">Chọn phương thức thanh toán</span>
                </div>

                <div class="ATM_icons_list">
                    <div class="ATM_icons_row">
                        <div id="visa_logo" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>

                        <div id="mastercard_logo" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>

                        <div id="napas_log" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>
                    </div>
                    <div class="ATM_icons_row">
                        <div id="momo_logo" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>

                        <div id="zalo_pay_logo" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>

                        <div id="tienmat_logo" class="bank_logo">
                            <img src="../../assets/images/icon/05-zalopay-300x300.png" alt="">
                        </div>
                    </div>
                </div>

                
                <form action="" id="form_input">
                    <div class="form-group">
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Số thẻ">
                    </div>
                    <div class="form-group" id="nhh">

                        <div class="left_nhh">
                            <label for="" style="color: rgb(176, 43, 25);">Ngày hết hạn</label>
                            <div id="nhh_input">
                                <input type="text" id="month_input" required>
                                <label for="">/</label>
                                <input type="text" id="year_input" required>
                            </div>
                        </div>

                        <div class="right_nhh">
                            <label for="" style="color: rgb(176, 43, 25);">CVV</label>
                            <div id="nhh_input">
                                <input type="text" id="CVV_input" required>
                        </div>
                        
                    </div>
                </form>
            </div>
           
        </div>
        <button type="button" class="btn btn-danger" id="tieptuc_btn_visa">Tiếp tục</button>
    </div>
</body>

</html>
